[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histogen"
version = "1.0.0"
description = "Generalization of vision pre-trained models for histopathology (Sci. Rep. 2023)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Milad Sikaroudi" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
histogen-train = "histogen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
